<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>训练日志 · 微信小程序高保真原型</title>
  <style>
    :root {
      --paper: #dff0eb;
      --paper-deep: #e8f2ee;
      --surface: #ffffff;
      --ink: #153b3a;
      --muted: #6f8780;
      --line: #dcebe5;
      --accent: #16bfae;
      --accent-dark: #0b8f82;
      --yellow: #ffd84a;
      --olive: #4f8f7d;
      --shadow: 0 16px 38px rgba(28, 91, 79, 0.12);
      --display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      line-break: strict;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1100px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; text-wrap: pretty; }
    h1, h2, h3 { text-wrap: balance; }

    .prototype-shell { padding: 30px 42px 52px; }
    .prototype-header {
      max-width: 1450px;
      margin: 0 auto 26px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .eyebrow {
      color: var(--accent-dark);
      font: 700 11px/1.2 var(--body);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .prototype-header h1 {
      margin-top: 5px;
      font: 700 31px/1.12 var(--display);
      letter-spacing: 0;
    }
    .prototype-header p { color: var(--muted); font-size: 13px; }
    .assumption-note {
      max-width: 470px;
      padding: 12px 15px;
      border-top: 1px solid var(--ink);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .screen-wall {
      max-width: 1450px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px 22px;
      align-items: start;
    }
    .screen-cell { min-width: 0; }
    .screen-label {
      margin: 0 0 9px 3px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }
    .screen-label strong { color: var(--ink); font-weight: 700; }
    .screen-label span { color: var(--accent-dark); font-size: 11px; }
    .phone-holder { display: flex; justify-content: center; }

    .phone-screen {
      width: 100%;
      min-height: 100%;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
    }
    .phone-screen button { border: 0; }
    .phone-scroll { min-height: 100%; padding: 17px 15px 22px; }
    .phone-topline { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }
    .phone-topline button { padding: 2px 0; color: var(--accent-dark); background: transparent; font-size: 11px; }
    .phone-title { margin-top: 7px; font: 700 25px/1.18 var(--display); }
    .phone-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .section-kicker { margin: 21px 0 8px; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

    .hero-panel {
      padding: 17px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 10px 22px rgba(28, 91, 79, .08);
    }
    .hero-panel .overline { color: var(--accent-dark); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .hero-panel h2 { margin: 5px 0 10px; color: var(--ink); font: 700 23px/1.2 var(--display); }
    .hero-panel p { color: var(--muted); font-size: 12px; }
    .hero-meta { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .hero-meta strong { color: var(--ink); font-size: 17px; font-weight: 700; }

    .primary-button {
      width: 100%;
      min-height: 45px;
      margin-top: 14px;
      padding: 9px 14px;
      color: #fff;
      background: var(--accent);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s ease, background .18s ease;
    }
    .primary-button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .ghost-button {
      min-height: 37px;
      padding: 7px 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line) !important;
      border-radius: 10px;
      font-size: 12px;
    }
    .ghost-button:hover { border-color: var(--ink) !important; }
    .small-button { min-height: 31px; padding: 5px 9px; font-size: 11px; }

    .exercise-list { display: grid; gap: 7px; }
    .exercise-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 29px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
      text-align: left;
    }
    .exercise-row:hover { border-color: var(--accent); background: #f7fffc; }
    .exercise-index { color: var(--accent-dark); font: 700 16px/1 var(--display); }
    .exercise-name { font-size: 13px; font-weight: 700; }
    .exercise-note { margin-top: 1px; color: var(--muted); font-size: 10px; }
    .exercise-target { padding: 5px 7px; color: var(--ink); background: #fff6c9; border-radius: 7px; font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; white-space: nowrap; }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 56px;
      padding: 5px 8px 6px;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
    }
    .tabbar button {
      color: #8aa39b;
      background: transparent;
      font-size: 10px;
      line-height: 1.25;
    }
    .tabbar button strong { display: block; margin-bottom: 2px; color: currentColor; font-size: 17px; font-weight: 500; }
    .tabbar button.active { color: var(--accent-dark); font-weight: 700; }

    .plan-card { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 9px 18px rgba(28, 91, 79, .06); }
    .plan-card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .plan-card h2 { font: 700 20px/1.25 var(--display); }
    .plan-card small { color: var(--muted); font-size: 10px; }
    .status-chip { display: inline-flex; align-items: center; min-height: 23px; padding: 3px 8px; color: var(--ink); background: var(--yellow); border-radius: 20px; font-size: 10px; font-weight: 700; }
    .cycle-track { display: flex; gap: 6px; margin: 15px 0 3px; }
    .cycle-day { flex: 1; min-height: 43px; padding: 6px 2px; color: var(--muted); background: #e8f2ee; border-radius: 8px; text-align: center; font-size: 10px; }
    .cycle-day strong { display: block; color: var(--ink); font: 700 17px/1 var(--display); }
    .cycle-day.current { color: var(--ink); background: var(--yellow); }
    .cycle-day.current strong { color: var(--ink); }
    .cycle-day.done { color: var(--accent-dark); background: #d9f5ef; }
    .plan-list { display: grid; gap: 8px; }
    .plan-row { display: flex; justify-content: space-between; align-items: center; min-height: 46px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .plan-row strong { font-size: 12px; }
    .plan-row span { color: var(--muted); font-size: 10px; }
    .plan-row button { padding: 3px 0; color: var(--accent-dark); background: transparent; font-size: 11px; }

    .search-row { display: flex; gap: 7px; align-items: center; }
    .search-input { width: 100%; min-height: 39px; padding: 8px 11px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; outline: none; font-size: 12px; }
    .search-input:focus { border-color: var(--accent); }
    .filter-line { display: flex; gap: 6px; overflow: hidden; margin: 10px 0 11px; }
    .filter-pill { padding: 5px 9px; color: var(--muted); background: #e8f2ee; border: 0; border-radius: 20px; white-space: nowrap; font-size: 10px; }
    .filter-pill.active { color: #fff; background: var(--accent); }
    .library-item { display: grid; grid-template-columns: 48px 1fr auto; gap: 9px; align-items: center; min-height: 64px; padding: 8px; background: var(--surface); border-bottom: 1px solid var(--line); text-align: left; }
    .library-item:hover { background: #f7fffc; }
    .library-art { display: grid; place-items: center; width: 48px; height: 48px; color: var(--accent-dark); background: #d9f5ef; border-radius: 9px; font: 700 19px/1 var(--display); }
    .library-item strong { font-size: 12px; }
    .library-item small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .library-item em { color: var(--accent-dark); font-size: 10px; font-style: normal; }
    .media-note { margin-top: 13px; padding: 10px; color: var(--muted); background: #fff9db; border: 1px dashed #d9c879; border-radius: 10px; font-size: 10px; line-height: 1.5; }

    .training-shell { min-height: 100%; padding: 17px 15px 22px; color: var(--ink); background: #e7f7f3; }
    .training-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }
    .training-top button { padding: 2px 0; color: var(--accent-dark); background: transparent; font-size: 11px; }
    .training-shell h2 { margin-top: 22px; color: var(--ink); font: 700 28px/1.15 var(--display); }
    .training-shell .training-caption { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .training-progress { display: flex; gap: 5px; margin: 20px 0 17px; }
    .training-progress i { flex: 1; height: 4px; background: #cbe4de; border-radius: 4px; }
    .training-progress i.on { background: var(--accent); }
    .set-table { display: grid; gap: 5px; }
    .set-line { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 5px; align-items: center; min-height: 42px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .set-line.head { min-height: 24px; padding: 0 8px; color: var(--muted); background: transparent; border: 0; font-size: 10px; }
    .set-line span { color: var(--muted); font-size: 11px; }
    .set-line strong { color: var(--ink); font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .set-input { width: 100%; padding: 5px 7px; color: var(--ink); background: #f8fcfa; border: 1px solid var(--line); border-radius: 6px; text-align: center; font-size: 12px; }
    .training-actions { display: grid; gap: 7px; margin-top: 18px; }
    .training-actions button { min-height: 41px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    .training-actions button.primary { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 700; }
    .training-note { margin-top: 16px; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .record-tabs { display: flex; gap: 18px; margin: 18px 0 10px; border-bottom: 1px solid var(--line); }
    .record-tabs button { padding: 0 0 7px; color: var(--muted); background: transparent; font-size: 11px; }
    .record-tabs button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
    .record-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 9px; align-items: center; min-height: 69px; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .record-date { color: var(--accent-dark); font: 700 15px/1.05 var(--display); }
    .record-date small { display: block; margin-top: 4px; color: var(--muted); font: 10px/1 var(--body); }
    .record-item strong { font-size: 12px; }
    .record-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .record-item em { color: var(--olive); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-style: normal; }
    .chart-wrap { padding: 13px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
    .chart-head strong { font: 700 17px/1 var(--display); }
    .chart-head span { color: var(--muted); font-size: 10px; }
    .chart { position: relative; height: 125px; margin-top: 11px; border-left: 1px solid #b5d4cc; border-bottom: 1px solid #b5d4cc; }
    .chart::before, .chart::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: rgba(44, 122, 110, .16); }
    .chart::before { top: 35%; } .chart::after { top: 68%; }
    .chart-bars { height: 100%; display: flex; align-items: flex-end; justify-content: space-around; gap: 7px; padding: 0 8px; }
    .chart-bar { position: relative; flex: 1; max-width: 24px; background: var(--accent); border-radius: 4px 4px 0 0; }
    .chart-bar:last-child { background: var(--yellow); }
    .chart-bar span { position: absolute; bottom: -20px; left: 50%; color: var(--muted); transform: translateX(-50%); font-size: 9px; }
    .record-footnote { margin-top: 25px; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .profile-row { display: flex; justify-content: space-between; align-items: center; margin: 19px 0 17px; }
    .profile-mark { display: flex; align-items: center; gap: 11px; }
    .avatar { display: grid; place-items: center; width: 45px; height: 45px; color: var(--ink); background: var(--yellow); border-radius: 50%; font: 700 20px/1 var(--display); }
    .profile-mark strong { display: block; font-size: 14px; }
    .profile-mark span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .setting-group { margin-top: 17px; }
    .setting-group h3 { margin-bottom: 7px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; min-height: 46px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .setting-row strong { font-size: 12px; }
    .setting-row span { color: var(--muted); font-size: 11px; }
    .toggle { position: relative; width: 37px; height: 21px; padding: 0; background: #c7ded8; border-radius: 20px; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; background: #fff; border-radius: 50%; transition: transform .18s ease; }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(16px); }
    .queue-note { margin-top: 17px; padding: 11px; color: var(--ink); background: #fff9db; border-radius: 10px; font-size: 10px; line-height: 1.5; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(24,29,26,.48); }
    .modal-card { width: min(420px, 100%); max-height: 82vh; overflow: auto; padding: 20px; color: var(--ink); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .modal-head h2 { font: 700 22px/1.25 var(--display); }
    .modal-close { padding: 1px 0; color: var(--muted); background: transparent; font-size: 20px; line-height: 1; }
    .modal-kicker { margin-bottom: 4px; color: var(--accent-dark); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .modal-body { margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .modal-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 13px; }
    .modal-metrics div { padding: 10px 8px; background: var(--paper-deep); border-radius: 9px; }
    .modal-metrics strong { display: block; color: var(--ink); font: 700 17px/1 var(--display); }
    .modal-metrics span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .modal-actions { display: grid; gap: 7px; margin-top: 17px; }
    .modal-actions button { min-height: 40px; border-radius: 9px; }

    @media (max-width: 1250px) {
      body { min-width: 930px; }
      .prototype-shell { padding-left: 22px; padding-right: 22px; }
      .screen-wall { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1080px; }
    }
  </style>
</head>
<body>
  <!--
    设计假设（基于 docs/spec.md + 已确认方向 B）：
    - 这是个人自用的力量训练小程序，核心情绪是「轻快但有纪律」，不是健身社交或竞赛产品。
    - 原型默认展示 6 个主屏，方便一眼检查信息架构；每台设备都能切 tab、打开详情或触发 modal。
    - 计划与记录中的数字是流程演示数据，不代表真实用户数据；动作媒体因 Gym visual 授权未落实，保留诚实占位。
    - 视觉母题来自「训练循环」：周期编号、青色进度条、黄色状态点，承接第 N 天循环与完成驱动推进。
    - 这是 UI 原型，不是生产小程序代码；不包含 CloudBase、openid 或真实离线队列。
  -->
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const exerciseData = [
      { id: 'bench', name: '杠铃卧推', target: '胸大肌 · 三头肌', equipment: '杠铃', prescription: '4 × 8 · 60 kg' },
      { id: 'incline', name: '上斜哑铃推举', target: '胸大肌上束', equipment: '哑铃', prescription: '3 × 10 · 22 kg' },
      { id: 'dip', name: '双杠臂屈伸', target: '胸大肌 · 三头肌', equipment: '自重', prescription: '3 × 8 · +5 kg' },
      { id: 'fly', name: '绳索夹胸', target: '胸大肌', equipment: '绳索', prescription: '3 × 12 · 18 kg' },
      { id: 'squat', name: '杠铃深蹲', target: '股四头肌 · 臀肌', equipment: '杠铃', prescription: '4 × 6 · 80 kg' },
      { id: 'row', name: '坐姿划船', target: '背阔肌 · 菱形肌', equipment: '器械', prescription: '4 × 10 · 52 kg' },
    ];

    const navItems = [
      { id: 'today', label: '今天', glyph: '今' },
      { id: 'plan', label: '计划', glyph: '计' },
      { id: 'records', label: '记录', glyph: '录' },
      { id: 'me', label: '我的', glyph: '我' },
    ];

    const iosFrameStyles = {
      wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60, boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
      screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
      statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", sans-serif', zIndex: 20, pointerEvents: 'none' },
      dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
      statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
      signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
      signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
      batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 },
      batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
      content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
      homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999 },
      homeIndicatorDark: { background: 'rgba(255,255,255,0.5)' },
    };

    function IosFrame({ children, width = 318, height = 688, time = '9:41', battery = 86, darkMode = false, showStatusBar = true, showDynamicIsland = true, showHomeIndicator = true }) {
      const textColor = darkMode ? '#fff' : '#000';
      return <div style={iosFrameStyles.wrapper}><div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        {showStatusBar && <div style={{ ...iosFrameStyles.statusBar, color: textColor }}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}><div style={{ ...iosFrameStyles.signalBar, height: 4 }} /><div style={{ ...iosFrameStyles.signalBar, height: 6 }} /><div style={{ ...iosFrameStyles.signalBar, height: 9 }} /><div style={{ ...iosFrameStyles.signalBar, height: 11 }} /></div><svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" /><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" /><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" /></svg><div style={iosFrameStyles.batteryIcon}><div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} /><div style={iosFrameStyles.batteryCap} /></div></div></div>}
        {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}
        <div style={iosFrameStyles.content}>{children}</div>
        {showHomeIndicator && <div style={{ ...iosFrameStyles.homeIndicator, ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}) }} />}
      </div></div>;
    }

    function TabBar({ active, onChange }) {
      return <nav className="tabbar">{navItems.map(item => <button key={item.id} className={active === item.id ? 'active' : ''} onClick={() => onChange(item.id)}><strong>{item.glyph}</strong>{item.label}</button>)}</nav>;
    }

    function TodayScreen({ onNavigate, onOpen }) {
      return <div className="phone-screen"><div className="phone-scroll">
        <div className="phone-topline"><span>2026年07月21日 · 周二</span><button onClick={() => onOpen({ type: 'sync' })}>本地已同步</button></div>
        <h1 className="phone-title">今天，练推。</h1>
        <p className="phone-subtitle">第 1 天 · 力量循环「推 / 拉 / 腿」</p>
        <div className="section-kicker">当前训练日</div>
        <div className="hero-panel">
          <span className="overline">PUSH · DAY 01</span>
          <h2>上肢推力</h2>
          <p>从上次的停留处继续。完成后，计划游标自动前进。</p>
          <div className="hero-meta"><span><strong>4</strong> 个动作</span><span><strong>46</strong> 分钟预估</span><span><strong>3,240</strong> kg 目标容量</span></div>
        </div>
        <button className="primary-button" onClick={() => onNavigate('train')}>开始训练 <span aria-hidden="true">↗</span></button>
        <div className="section-kicker">动作清单 · 统一目标</div>
        <div className="exercise-list">{exerciseData.slice(0, 4).map((item, index) => <button key={item.id} className="exercise-row" onClick={() => onOpen({ type: 'exercise', item })}><span className="exercise-index">0{index + 1}</span><span><strong className="exercise-name">{item.name}</strong><small className="exercise-note">{item.target}</small></span><span className="exercise-target">{item.prescription}</span></button>)}</div>
        <TabBar active="today" onChange={onNavigate} />
      </div></div>;
    }

    function PlanScreen({ onNavigate, onOpen }) {
      const [editing, setEditing] = useState(false);
      return <div className="phone-screen"><div className="phone-scroll">
        <div className="phone-topline"><span>循环计划</span><button onClick={() => setEditing(!editing)}>{editing ? '完成' : '编辑'}</button></div>
        <h1 className="phone-title">我的计划</h1>
        <p className="phone-subtitle">active 计划决定今天显示的训练日</p>
        <div className="section-kicker">Active</div>
        <div className="plan-card">
          <div className="plan-card-head"><div><h2>力量循环</h2><small>完成驱动 · 3 个训练日</small></div><span className="status-chip">进行中</span></div>
          <div className="cycle-track"><div className="cycle-day current"><strong>01</strong>推</div><div className="cycle-day"><strong>02</strong>拉</div><div className="cycle-day"><strong>03</strong>腿</div></div>
          <small>当前游标：第 1 天。未打卡不会跳过。</small>
        </div>
        <div className="section-kicker">训练日顺序</div>
        <div className="plan-list">{[['推', '4 个动作 · 约 46 分钟'], ['拉', '5 个动作 · 约 52 分钟'], ['腿', '4 个动作 · 约 48 分钟']].map(([name, meta], index) => <div className="plan-row" key={name}><span><strong>0{index + 1} · {name}</strong><span>{meta}</span></span>{editing ? <button onClick={() => onOpen({ type: 'toast', message: '排序交互已接入原型' })}>拖动</button> : <button onClick={() => onOpen({ type: 'day', name })}>查看</button>}</div>)}</div>
        <button className="ghost-button" style={{ width: '100%', marginTop: 12 }} onClick={() => onNavigate('library')}>＋ 添加动作</button>
        <button className="ghost-button" style={{ width: '100%', marginTop: 7 }} onClick={() => onOpen({ type: 'toast', message: '新计划入口已预留' })}>＋ 新建计划</button>
        <TabBar active="plan" onChange={onNavigate} />
      </div></div>;
    }

    function LibraryScreen({ onNavigate, onOpen }) {
      const [query, setQuery] = useState('');
      const [filter, setFilter] = useState('全部');
      const filtered = useMemo(() => exerciseData.filter(item => !query || `${item.name}${item.target}${item.equipment}`.includes(query)).filter(item => filter === '全部' || item.equipment === filter), [query, filter]);
      return <div className="phone-screen"><div className="phone-scroll">
        <div className="phone-topline"><button onClick={() => onNavigate('plan')}>← 返回计划</button><span>离线可浏览</span></div>
        <h1 className="phone-title">动作库</h1>
        <p className="phone-subtitle">力量训练 · 已过滤 cardio</p>
        <div className="section-kicker">查找动作</div>
        <div className="search-row"><input className="search-input" value={query} onChange={e => setQuery(e.target.value)} placeholder="搜索动作、部位或器械" /></div>
        <div className="filter-line">{['全部', '杠铃', '哑铃', '自重'].map(item => <button key={item} className={`filter-pill ${filter === item ? 'active' : ''}`} onClick={() => setFilter(item)}>{item}</button>)}</div>
        <div>{filtered.map(item => <button key={item.id} className="library-item" onClick={() => onOpen({ type: 'exercise', item })}><span className="library-art">{item.name.slice(0, 1)}</span><span><strong>{item.name}</strong><small>{item.target} · {item.equipment}</small></span><em>查看</em></button>)}</div>
        <div className="media-note">动作示意图待接入 Gym visual 云存储。正式上线前需完成书面授权并保留 © Gym visual 署名。</div>
        <TabBar active="plan" onChange={onNavigate} />
      </div></div>;
    }

    function TrainingScreen({ onNavigate, onOpen }) {
      return <div className="phone-screen"><div className="training-shell">
        <div className="training-top"><button onClick={() => onNavigate('today')}>← 暂停</button><span>本地 session · 未提交</span></div>
        <h2>上肢推力</h2><p className="training-caption">第 1 / 4 个动作 · 杠铃卧推</p>
        <div className="training-progress"><i className="on" /><i /><i /><i /></div>
        <div className="set-table"><div className="set-line head"><span>组</span><span>重量 kg</span><span>次数</span></div>{[1, 2, 3, 4].map((set, index) => <div className="set-line" key={set}><span>{set}</span><input className="set-input" defaultValue={index === 3 ? '' : '60'} aria-label={`第${set}组重量`} /><input className="set-input" defaultValue={index === 3 ? '' : '8'} aria-label={`第${set}组次数`} /></div>)}</div>
        <div className="training-actions"><button onClick={() => onOpen({ type: 'toast', message: '已新增一组空白记录' })}>＋ 添加一组</button><button onClick={() => onOpen({ type: 'toast', message: '动作已从本次 session 跳过' })}>跳过这个动作</button><button className="primary" onClick={() => onOpen({ type: 'summary' })}>完成训练并提交</button></div>
        <p className="training-note">结束提交时需要网络。若当前无网，session 会进入待重试队列，不影响本地记录。</p>
      </div></div>;
    }

    function RecordsScreen({ onNavigate, onOpen }) {
      const [view, setView] = useState('sessions');
      return <div className="phone-screen"><div className="phone-scroll">
        <div className="phone-topline"><span>训练记录</span><button onClick={() => onOpen({ type: 'toast', message: '仅展示已提交 session' })}>筛选</button></div>
        <h1 className="phone-title">记录</h1><p className="phone-subtitle">历史快照不会随计划修改而变化</p>
        <div className="record-tabs"><button className={view === 'sessions' ? 'active' : ''} onClick={() => setView('sessions')}>训练场次</button><button className={view === 'trend' ? 'active' : ''} onClick={() => setView('trend')}>动作趋势</button></div>
        {view === 'sessions' ? <div>{[['21', '07月', '上肢推力', '4 个动作 · 46 分钟', '3,186 kg'], ['18', '07月', '下肢训练', '4 个动作 · 49 分钟', '4,020 kg'], ['15', '07月', '上肢拉力', '5 个动作 · 52 分钟', '3,640 kg']].map(row => <button className="record-item" key={row[0]} onClick={() => onOpen({ type: 'record', row })}><span className="record-date">{row[0]}<small>{row[1]}</small></span><span><strong>{row[2]}</strong><span>{row[3]}</span></span><em>{row[4]}</em></button>)}</div> : <div><div className="chart-wrap"><div className="chart-head"><strong>杠铃卧推</strong><span>指标：volume</span></div><div className="chart"><div className="chart-bars">{[['15', 50], ['18', 67], ['21', 84], ['24', 74], ['27', 96]].map(([date, height]) => <div className="chart-bar" style={{ height: `${height}%` }} key={date}><span>{date}</span></div>)}</div></div></div><p className="record-footnote">纵轴默认使用总容量（重量 × 次数）。自重动作会切换为总次数；top weight 与估算 1RM 预留为后续指标。</p></div>}
        <TabBar active="records" onChange={onNavigate} />
      </div></div>;
    }

    function MeScreen({ onNavigate, onOpen }) {
      const [offline, setOffline] = useState(true);
      return <div className="phone-screen"><div className="phone-scroll">
        <div className="phone-topline"><span>个人空间</span><button onClick={() => onOpen({ type: 'toast', message: '已使用静默 openid 登录' })}>已登录</button></div>
        <div className="profile-row"><div className="profile-mark"><div className="avatar">L</div><div><strong>训练者</strong><span>只在本机展示，不含社交关系</span></div></div><button className="ghost-button small-button" onClick={() => onOpen({ type: 'toast', message: '个人资料入口已预留' })}>编辑</button></div>
        <div className="setting-group"><h3>训练偏好</h3><div className="setting-row"><span><strong>训练单位</strong></span><span>kg</span></div><div className="setting-row"><span><strong>默认指标</strong></span><span>volume</span></div></div>
        <div className="setting-group"><h3>存储与网络</h3><div className="setting-row"><span><strong>离线训练模式</strong><span>训练中不依赖网络</span></span><button className={`toggle ${offline ? 'on' : ''}`} onClick={() => setOffline(!offline)} aria-label="切换离线训练模式" /></div><div className="setting-row"><span><strong>待提交 session</strong><span>结束时整体提交</span></span><span style={{ color: 'var(--olive)', fontWeight: 700 }}>0 条</span></div></div>
        <div className="queue-note">云开发连接正常。下一次提交会将本地 session 写入 CloudBase；无网时自动排队重试。</div>
        <div className="setting-group"><h3>关于</h3><div className="setting-row"><span><strong>媒体授权状态</strong></span><span style={{ color: 'var(--accent-dark)' }}>待处理</span></div><div className="setting-row"><span><strong>版本</strong></span><span>原型 · MVP 0.1</span></div></div>
        <TabBar active="me" onChange={onNavigate} />
      </div></div>;
    }

    function Modal({ modal, onClose, onNavigate }) {
      if (!modal) return null;
      if (modal.type === 'toast') return <div className="modal-backdrop" onClick={onClose}><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">原型反馈</div><div className="modal-head"><h2>{modal.message}</h2><button className="modal-close" onClick={onClose}>×</button></div><div className="modal-actions"><button className="primary-button" style={{ marginTop: 0 }} onClick={onClose}>知道了</button></div></div></div>;
      if (modal.type === 'sync') return <div className="modal-backdrop" onClick={onClose}><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">数据状态</div><div className="modal-head"><h2>本地与云端一致</h2><button className="modal-close" onClick={onClose}>×</button></div><p className="modal-body">当前没有待提交的训练 session。训练过程中可以保持离线，只有结束提交时才需要网络。</p><div className="modal-metrics"><div><strong>0</strong><span>待提交</span></div><div><strong>3</strong><span>训练日</span></div><div><strong>100%</strong><span>同步</span></div></div></div></div>;
      if (modal.type === 'summary') return <div className="modal-backdrop"><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">训练完成</div><div className="modal-head"><h2>今天做得很稳。</h2><button className="modal-close" onClick={() => onNavigate('today')}>×</button></div><p className="modal-body">这条 session 已经在本机保存。提交成功后，计划游标会从第 1 天推进到第 2 天。</p><div className="modal-metrics"><div><strong>4</strong><span>动作</span></div><div><strong>3,186</strong><span>kg 容量</span></div><div><strong>46m</strong><span>时长</span></div></div><div className="modal-actions"><button className="primary-button" style={{ marginTop: 0 }} onClick={() => onNavigate('today')}>回到今天</button><button className="ghost-button" onClick={onClose}>继续查看记录</button></div></div></div>;
      if (modal.type === 'record') { const row = modal.row; return <div className="modal-backdrop" onClick={onClose}><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">训练快照 · {row[0]} {row[1]}</div><div className="modal-head"><h2>{row[2]}</h2><button className="modal-close" onClick={onClose}>×</button></div><p className="modal-body">这条记录来自当次 session 的独立副本。之后编辑计划不会改写这里的动作和数据。</p><div className="modal-metrics"><div><strong>{row[3].split(' · ')[0]}</strong><span>动作</span></div><div><strong>{row[4].replace(' kg','')}</strong><span>总容量</span></div><div><strong>{row[3].split(' · ')[1]}</strong><span>时长</span></div></div></div></div>; }
      if (modal.type === 'exercise') { const item = modal.item; return <div className="modal-backdrop" onClick={onClose}><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">动作库 · {item.equipment}</div><div className="modal-head"><h2>{item.name}</h2><button className="modal-close" onClick={onClose}>×</button></div><div style={{ display: 'grid', placeItems: 'center', height: 145, marginTop: 14, color: '#8b5a4b', background: '#e9ded2', borderRadius: 12, font: '700 44px/1 var(--display)' }}>{item.name.slice(0, 1)}</div><p className="modal-body">目标肌群：{item.target}。原型中只保留动作名称与目标字段，媒体位将在获得 Gym visual 授权后接入云存储。</p><div className="modal-actions"><button className="primary-button" style={{ marginTop: 0 }} onClick={() => { onClose(); onNavigate('plan'); }}>加入当前训练日</button></div></div></div>; }
      if (modal.type === 'day') return <div className="modal-backdrop" onClick={onClose}><div className="modal-card" onClick={e => e.stopPropagation()}><div className="modal-kicker">训练日详情</div><div className="modal-head"><h2>{modal.name} · 训练日</h2><button className="modal-close" onClick={onClose}>×</button></div><p className="modal-body">动作顺序可以编辑；开始训练时会复制为独立 session，临时加练或跳过不会反写计划。</p><div className="modal-actions"><button className="ghost-button" onClick={onClose}>关闭</button></div></div></div>;
      return null;
    }

    function AppPhone({ initial, label, tag }) {
      const [screen, setScreen] = useState(initial);
      const [modal, setModal] = useState(null);
      const navigate = next => setScreen(next);
      let content = null;
      if (screen === 'today') content = <TodayScreen onNavigate={navigate} onOpen={setModal} />;
      if (screen === 'plan') content = <PlanScreen onNavigate={navigate} onOpen={setModal} />;
      if (screen === 'library') content = <LibraryScreen onNavigate={navigate} onOpen={setModal} />;
      if (screen === 'train') content = <TrainingScreen onNavigate={navigate} onOpen={setModal} />;
      if (screen === 'records') content = <RecordsScreen onNavigate={navigate} onOpen={setModal} />;
      if (screen === 'me') content = <MeScreen onNavigate={navigate} onOpen={setModal} />;
      return <div className="screen-cell"><div className="screen-label"><strong>{label}</strong><span>{tag}</span></div><div className="phone-holder"><IosFrame>{content}</IosFrame></div><Modal modal={modal} onClose={() => setModal(null)} onNavigate={next => { setModal(null); setScreen(next); }} /></div>;
    }

    function Prototype() {
      return <main className="prototype-shell"><header className="prototype-header"><div><div className="eyebrow">WeChat Mini Program · MVP Prototype</div><h1>训练日志 / 轻快力量训练</h1><p>方向 B · 晴空青黄 · 6 个主屏 · 可交互状态</p></div><div className="assumption-note"><strong>设计注记</strong><br />用青色承载「开始 / 继续 / 完成」，用黄色标记进度与 active 状态。示例数据仅用于演示信息层级，媒体位等待授权后接入。</div></header><section className="screen-wall"><AppPhone initial="today" label="01 · 今天" tag="active plan" /><AppPhone initial="plan" label="02 · 计划" tag="cycle editor" /><AppPhone initial="library" label="03 · 动作库" tag="offline browse" /><AppPhone initial="train" label="04 · 训练中" tag="session draft" /><AppPhone initial="records" label="05 · 记录" tag="history + trend" /><AppPhone initial="me" label="06 · 我的" tag="storage" /></section></main>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Prototype />);
  </script>
</body>
</html>
