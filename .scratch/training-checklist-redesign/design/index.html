    @media(max-width:600px){.board{padding:24px 16px}.board h1{font-size:26px}.frames{gap:18px}.phone{width:360px;height:800px}.board-head .row{align-items:flex-start}.board-tag{font-size:10px;white-space:nowrap}.board p{font-size:12px}}@media(max-width:359px){.content{padding-left:16px;padding-right:16px}.set-head,.set-row{gap:5px;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) 36px 22px}.sheet{padding-left:20px;padding-right:20px}.timer-ring{width:180px;height:180px;margin:16px auto}.training-dock{padding-left:16px;padding-right:16px}.day-line h1{font-size:34px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
  <div id="root"></div>
  <script>
    const icons={check:'<path d="m5 12 4 4L19 6"/>',back:'<path d="m14 5-7 7 7 7"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6m-3 0v3"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m9 5 10 7-10 7Z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',dumbbell:'<path d="m7 7 10 10M5 3l4 4-2 2-4-4Zm12 12 4 4-2 2-4-4ZM3 7l4 4m6 6 4 4M7 3l4 4m6 6 4 4"/>',bench:'<path d="M3 15h18M6 15v5m12-5v5M4 5v7m16-7v7M2 8h20M7 6v4m10-4v4"/>',cable:'<path d="M6 21V3h12v18M4 21h5m6 0h5M12 3v8m-4 3 4-3 4 3M9 17h6m-6 3h6"/>',home:'<path d="m3 10 9-7 9 7v10H3ZM9 20v-7h6v7"/>',plan:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M8 12h8m-8 4h5"/>',chart:'<path d="M4 3v17h17M8 15l4-5 4 2 5-6"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',trend:'<path d="m4 16 6-6 4 3 6-9m-6 0h6v6"/>'};
    const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.dumbbell}</svg>`;
    const root=document.querySelector('#root');
    const initialScreen=new URLSearchParams(location.search).get('screen');
    const screens=[['today','今天','计划与继续训练'],['training','训练中','逐组勾选记录'],['rest','间歇展开','半屏计时面板'],['mini','间歇收起','继续编辑记录'],['summary','完成小结','本次训练成果']];
    if(!initialScreen){
      root.innerHTML=`<main class="board"><header class="board-head"><div class="row"><span class="brand">FORGE</span><span class="board-tag">视觉提案 01 · 可点击原型</span></div><h1>专注每一组，也照顾每一次休息。</h1><p>深墨绿 × 清晰组表 × 手动间歇。下方五屏可独立操作；点击“单独预览”查看手机尺寸页面。示例数据仅用于设计审阅。</p></header><div class="frames">${screens.map(([id,title,subtitle])=>`<section><h2 class="frame-title">${title}<span>${subtitle}</span></h2><div class="phone"><iframe title="${title}" src="?screen=${id}"></iframe></div><a class="open-link" href="?screen=${id}" target="_blank">单独预览 ${icon('chevron')}</a></section>`).join('')}</div><p class="board-footer">视觉稿：布局与交互演示。业务接入、微信键盘、振动声音和后台恢复将在小程序阶段验证。</p></main>`;
    }else{
      let screen=['rest','mini'].includes(initialScreen)?'training':initialScreen;
      let exercises=[{name:'杠铃卧推',type:'bench',area:'胸部',weight:40,reps:12,sets:[{weight:40,reps:12,done:true},{weight:40,reps:10,done:true},{weight:40,reps:10,done:false}]},{name:'上斜哑铃卧推',type:'dumbbell',area:'胸部',weight:16,reps:12,sets:[{weight:16,reps:12,done:false},{weight:16,reps:12,done:false},{weight:16,reps:12,done:false}]},{name:'绳索下压',type:'cable',area:'肱三头肌',weight:20,reps:12,sets:[{weight:20,reps:12,done:false},{weight:20,reps:12,done:false},{weight:20,reps:12,done:false}]}];
      let restOn=['rest','mini'].includes(initialScreen),sheet=initialScreen==='rest'?'rest':null;
      let remaining=90,baseSeconds=90,restPaused=false,trainingPaused=false,ticking=false,deadline=0,elapsed=1122,summary=null,toastTimer=null,detailIndex=0;
      const stats=()=>({completed:exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),total:exercises.reduce((n,e)=>n+e.sets.length,0)});
      const time=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
      const statusbar=()=>`<div class="statusbar"><span class="mono">9:41</span><span class="status-symbols"><span style="font-size:10px;letter-spacing:1px">▂▄▆</span><span style="font-size:13px">⌁</span><span class="battery"></span></span></div>`;
      const nav=(content)=>`<header class="nav">${content}</header>`;
      const capsule='<span class="wx-capsule" aria-hidden="true"><b>•••</b><i></i></span>';
      const thumb=type=>`<div class="thumb">${icon(type)}</div>`;
      const tabbar=()=>`<nav class="tabbar" aria-label="底部导航">${[['home','今天'],['plan','计划'],['chart','记录'],['user','我的']].map(([i,n],j)=>`<button class="${j===0?'selected':''}" data-action="${j===0?'today':'demo'}">${icon(i)}<span>${n}</span></button>`).join('')}</nav>`;
      function today(){return nav(`<span class="brand">FORGE</span>${capsule}`)+`<main class="content home-top"><div class="row"><span class="date">10 月 24 日，星期六</span><span class="pill green">训练日</span></div><div class="day-line"><div><h1>胸部与三头</h1><span class="muted">力量循环计划</span></div><div class="day-mark">DAY<strong class="mono">01</strong></div></div><p class="home-caption"><strong class="mono">3</strong> 个动作　<strong class="mono">9</strong> 组训练　<span>第 1 / 3 天</span></p><section class="resume-card"><div class="row"><span class="resume-title"><i class="live-dot"></i>有一场训练正在进行</span><span class="small green mono">2 / 9 组</span></div><p class="resume-meta">力量循环计划 · 胸部与三头</p><button class="primary" data-action="training">继续训练 ${icon('arrow')}</button><button class="text-button" data-action="new">按当前计划开始新训练</button></section><div class="row"><h2 class="section-title">今天练这些</h2><span class="small muted">按你的节奏</span></div>${exercises.map(e=>`<div class="exercise-preview">${thumb(e.type)}<div><h3>${e.name}</h3><div class="prescription">${e.area} · ${e.weight} kg</div></div><span class="tail mono">3 × 12</span></div>`).join('')}<p class="prototype-note">完成本次训练后，进入背部与二头。</p></main>${tabbar()}`;}
      function training(){const {completed,total}=stats();return nav(`<button class="icon-button" data-action="today" aria-label="返回今天">${icon('back')}</button><span class="elapsed mono">${icon('clock')} <span id="elapsed">${time(elapsed)}</span></span><button class="icon-button" data-action="pause-training" aria-label="${trainingPaused?'继续训练':'暂停训练'}">${icon(trainingPaused?'play':'pause')}</button>`)+`<main class="content training-content">${trainingPaused?'<div class="paused-banner">训练已暂停 · 点击右上角继续</div>':''}<h1 class="training-title">胸部与三头</h1><div class="training-meta">力量循环计划 · 第 1 天</div><div class="training-progress"><div class="row progress-head"><span class="muted">已完成 <b class="green mono" id="completed-count">${completed}</b> / ${total} 组</span><span class="green">${completed===total?'全部完成':'稳稳完成每一组'}</span></div><div class="progress-track"><div style="width:${completed/total*100}%"></div></div></div>${exercises.map((e,ei)=>`<section class="exercise-card"><div class="ex-heading"><button style="padding:0" data-action="detail" data-ex="${ei}" aria-label="查看${e.name}动作要领">${thumb(e.type)}</button><div><h2>${e.name}</h2><div class="small muted">${e.sets.filter(s=>s.done).length} / ${e.sets.length} 组完成 · ${e.area}</div></div><button class="icon-button" data-action="exercise-menu" data-ex="${ei}" aria-label="${e.name}更多操作">${icon('more')}</button></div><div class="set-head"><span>组</span><span>重量 kg</span><span>次数</span><span>完成</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row ${s.done?'completed':''}"><span class="set-number mono">${si+1}</span><input class="mono" inputmode="decimal" aria-label="${e.name}第${si+1}组重量" value="${s.weight}" data-ex="${ei}" data-set="${si}" data-field="weight" ${trainingPaused?'disabled':''}><input class="mono" inputmode="numeric" aria-label="${e.name}第${si+1}组次数" value="${s.reps}" data-ex="${ei}" data-set="${si}" data-field="reps" ${trainingPaused?'disabled':''}><button class="check" data-action="check" data-ex="${ei}" data-set="${si}" aria-label="${e.name}第${si+1}组${s.done?'取消完成':'标记完成'}" aria-pressed="${s.done}" ${trainingPaused?'disabled':''}><span class="check-box">${icon('check')}</span></button>${!s.done&&e.sets.length>1?`<button class="delete" data-action="delete" data-ex="${ei}" data-set="${si}" aria-label="删除${e.name}第${si+1}组" ${trainingPaused?'disabled':''}>−</button>`:'<span></span>'}</div>`).join('')}<button class="add-set" data-action="add-set" data-ex="${ei}" ${trainingPaused?'disabled':''}>＋ 增加一组</button>${e.sets.some(s=>s.done)&&!restOn?`<button class="rest-launch" data-action="start-rest" ${trainingPaused?'disabled':''}>${icon('clock')} 开始间歇 <span class="mono">${time(baseSeconds)}</span></button>`:''}</section>`).join('')}</main><footer class="training-dock">${restOn?`<div class="mini-timer-wrap"><button class="mini-timer" data-action="expand-rest">${icon('clock')}<span><span class="mini-label">${trainingPaused||restPaused?'间歇已暂停':'组间休息'}</span><br><span class="mini-time mono" data-clock>${time(remaining)}</span></span><span class="expand">展开 ${icon('down')}</span></button></div>`:''}<div class="dock-actions"><button class="secondary" data-action="add-exercise" ${trainingPaused?'disabled':''}>＋ 加练动作</button><button class="primary" data-action="finish" ${completed===0||trainingPaused?'disabled':''}>结束训练</button></div></footer>`;}
      function restSheet(){return `<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="组间休息"><div class="sheet-handle"></div><div class="row"><div><h2>组间休息</h2><div class="sheet-context">调整呼吸，准备下一组。</div></div><button class="collapse" data-action="collapse-rest">收起⌄</button></div><div class="timer-ring"><svg class="ring-svg" viewBox="0 0 210 210" aria-hidden="true"><circle class="ring-bg" cx="105" cy="105" r="94"/><circle class="ring-progress" cx="105" cy="105" r="94"/></svg><div class="clock mono" data-clock>${time(remaining)}</div><div class="clock-label">${trainingPaused||restPaused?'计时已暂停':'留一点时间，恢复力量'}</div></div><div class="presets">${[60,90,120,180].map(s=>`<button class="preset ${baseSeconds===s?'active':''}" data-action="preset" data-seconds="${s}">${s} 秒</button>`).join('')}</div><div class="timer-controls"><button data-action="adjust-rest" data-delta="-15">−15 秒</button><button class="pause-rest" data-action="pause-rest" ${trainingPaused?'disabled':''}>${restPaused?'继续计时':'暂停计时'}</button><button data-action="adjust-rest" data-delta="15">＋15 秒</button></div><button class="primary end-rest" data-action="end-rest">结束休息</button><p class="sheet-foot">收起后可继续填写和勾选训练记录</p></section></div>`;}
      function summaryPage(){const s=summary||{sets:9,count:3,volume:3728,duration:'42:18',bodyReps:0};return nav(`<button class="icon-button" data-action="today" aria-label="返回今天">${icon('back')}</button><span>训练小结</span>${capsule}`)+`<main class="content summary-content"><div class="success-symbol">${icon('check')}</div><h1>今天，练到了。</h1><div class="summary-sub">胸部与三头 · 10 月 24 日</div><section class="summary-stats"><div class="summary-stat"><strong class="mono">${s.duration}</strong><span class="stat-label">训练时长</span></div><div class="summary-stat"><strong class="mono">${String(s.sets).padStart(2,'0')}</strong><span class="unit">组</span><span class="stat-label">实际完成</span></div><div class="summary-stat"><strong class="mono">${s.volume.toLocaleString()}</strong><span class="unit">kg</span><span class="stat-label">负重训练容量</span></div><div class="summary-stat"><strong class="mono">${String(s.count).padStart(2,'0')}</strong><span class="unit">个</span><span class="stat-label">完成动作</span></div></section>${!summary?`<div class="comparison">${icon('trend')}<div><strong>容量提升 8.6%</strong><div class="small muted">对比上次胸部与三头训练</div></div></div>`:''}<div class="row"><h2 class="section-title">这次的积累</h2><span class="small muted">${s.sets} 组已记录</span></div>${(summary?exercises.filter(e=>e.sets.some(s=>s.done)):exercises).map((e,i)=>`<div class="recap-row"><div>${e.name}<div class="small">${summary?e.sets.filter(s=>s.done).length:3} 组完成</div></div><span class="mono">${summary?e.sets.filter(s=>s.done).reduce((n,s)=>n+Number(s.weight)*Number(s.reps),0):[1280,1008,1440][i]} kg</span></div>`).join('')}<p class="prototype-note">下次训练：背部与二头</p></main><footer class="training-dock summary-dock"><button class="primary" data-action="today">回到今天 ${icon('arrow')}</button><button class="text-button" data-action="demo">查看训练记录</button></footer>`;}
      function genericSheet(){let title='',body='',action='',label='';const count=stats();if(sheet==='finish'){title='结束本次训练？';body=`已完成 ${count.completed} 组${count.total>count.completed?`，剩余 ${count.total-count.completed} 组将跳过`:''}。本次只记录实际完成的训练，计划进入下一训练日。`;action='confirm-finish';label='保存并结束';}if(sheet==='new'){title='开始一场新训练？';body='当前未结束训练的示例成绩将被替换。新训练使用今天的计划目标。';action='confirm-new';label='开始新训练';}if(sheet==='detail'){title=exercises[detailIndex].name;body=['双脚稳定踩地，肩胛向后收紧。控制杠铃下放至胸部附近，呼气推起，避免借助反弹。','背部贴紧靠垫，双脚踩稳。控制哑铃下放，以稳定节奏向上推起，保持手腕中立。','上臂靠近身体，保持躯干稳定。伸直手肘下压绳索，再有控制地回到起始位置。'][detailIndex];action='close';label='知道了';}return `<div class="overlay"><section class="sheet dialog-sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-handle"></div><h2>${title}</h2><p>${body}</p><button class="primary" data-action="${action}">${label}</button><button class="text-button" data-action="close">${sheet==='detail'?'关闭':'继续记录'}</button></section></div>`;}
      function render(){const scroll=root.querySelector('.content')?.scrollTop||0;root.innerHTML=`<div class="app">${statusbar()}${screen==='today'?today():screen==='summary'?summaryPage():training()}${sheet==='rest'?restSheet():sheet?genericSheet():''}<div class="home-indicator"></div></div>`;const content=root.querySelector('.content');if(content)content.scrollTop=scroll;updateClocks();}
      function updateClocks(){root.querySelectorAll('[data-clock]').forEach(e=>e.textContent=time(remaining));const ring=root.querySelector('.ring-progress');if(ring)ring.style.strokeDashoffset=590.6*(1-Math.min(1,remaining/baseSeconds));}
      function toast(text){clearTimeout(toastTimer);root.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=text;root.querySelector('.app').append(div);toastTimer=setTimeout(()=>div.remove(),2600);}
      function startRest(){restOn=true;remaining=baseSeconds;restPaused=false;ticking=true;deadline=Date.now()+remaining*1000;sheet='rest';}
      root.addEventListener('input',event=>{const {ex,set,field}=event.target.dataset;if(field){exercises[Number(ex)].sets[Number(set)][field]=event.target.value;}});
      root.addEventListener('change',event=>{const {ex,set,field}=event.target.dataset;if(!field)return;const s=exercises[Number(ex)].sets[Number(set)];if(s.done&&(s.weight===''||!Number.isFinite(Number(s.weight))||Number(s.weight)<0||!Number.isInteger(Number(s.reps))||Number(s.reps)<=0)){s.done=false;render();toast('数值无效，本组已取消完成；修正后可重新勾选');}});
      root.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;const ei=Number(button.dataset.ex),si=Number(button.dataset.set);const e=exercises[ei];
        if(action==='today'){screen='today';sheet=null;}if(action==='training'){screen='training';sheet=null;}if(action==='new')sheet='new';if(action==='confirm-new'){exercises.forEach(e=>e.sets=e.sets.map(()=>({weight:e.weight,reps:e.reps,done:false})));restOn=false;sheet=null;screen='training';elapsed=0;}
        if(action==='check'){const s=e.sets[si];if(!s.done&&(!(Number(s.reps)>0)||!Number.isInteger(Number(s.reps))||s.weight===''||Number(s.weight)<0||!Number.isFinite(Number(s.weight)))){toast('请填写有效重量和正整数次数');return;}s.done=!s.done;}
        if(action==='delete'&&!e.sets[si].done&&e.sets.length>1)e.sets.splice(si,1);
        if(action==='add-set'){const last=e.sets.at(-1);e.sets.push({weight:last.weight,reps:last.reps,done:false});}
        if(action==='start-rest')startRest();if(action==='expand-rest')sheet='rest';if(action==='collapse-rest')sheet=null;
        if(action==='preset'){baseSeconds=Number(button.dataset.seconds);remaining=baseSeconds;deadline=Date.now()+remaining*1000;ticking=true;}
        if(action==='adjust-rest'){remaining=Math.max(1,remaining+Number(button.dataset.delta));baseSeconds=Math.max(15,baseSeconds+Number(button.dataset.delta));deadline=Date.now()+remaining*1000;ticking=true;}
        if(action==='pause-rest'){restPaused=!restPaused;deadline=Date.now()+remaining*1000;ticking=true;}
        if(action==='end-rest'){restOn=false;sheet=null;ticking=false;}
        if(action==='pause-training'){trainingPaused=!trainingPaused;deadline=Date.now()+remaining*1000;}
        if(action==='finish')sheet='finish';if(action==='confirm-finish'){summary={sets:stats().completed,count:exercises.filter(e=>e.sets.some(s=>s.done)).length,volume:exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((m,s)=>m+Number(s.weight)*Number(s.reps),0),0),duration:time(elapsed),bodyReps:0};screen='summary';sheet=null;restOn=false;}
        if(action==='close')sheet=null;if(action==='detail'){detailIndex=ei;sheet='detail';}
        if(['demo','exercise-menu','add-exercise'].includes(action)){toast(action==='add-exercise'?'正式版本将打开现有动作库选择器':action==='exercise-menu'?'正式版本保留跳过／恢复动作操作':'此处为视觉稿，记录与计划沿用现有页面');return;}
        render();
      });
      setInterval(()=>{if(screen==='training'){elapsed++;const el=root.querySelector('#elapsed');if(el)el.textContent=time(elapsed);}if(restOn&&ticking&&!restPaused&&!trainingPaused){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));updateClocks();if(remaining===0){restOn=false;sheet=null;ticking=false;render();toast('休息结束，准备好再开始下一组');}}},1000);
      render();
    }
  </script>
</body>
</html>
