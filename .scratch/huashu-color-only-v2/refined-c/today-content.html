 .native-page {
  /* color */
  --bg: #08110e;
  --surface: #111d18;
  --surface-2: #1a2a23;
  --line: #1f3029;
  --line-strong: #2c4339;
  --ink: #eef7f2;
  --ink-dim: #a3b6ac;
  --ink-faint: #8aa095;
  --signal: #3ee6a0;
  --signal-deep: #1fbf83;
  --signal-ink: #062014;
  --signal-soft: rgba(62, 230, 160, 0.12);
  --signal-line: rgba(62, 230, 160, 0.45);
  --signal-glow: 0 0 16.64px rgba(62, 230, 160, 0.28);
  --signal-gradient: linear-gradient(180deg, #6ff5bd 0%, #3ee6a0 45%, #1fbf83 100%);
  --card-gradient: linear-gradient(180deg, #142420 0%, #0f1b17 100%);
  --card-shadow: 0 6.24px 20.8px rgba(0, 0, 0, 0.35);
  --thumb-gradient: linear-gradient(145deg, #e9fff5 0%, #b9f3d8 100%);
  --amber: #ffb020;
  --danger: #ff8f7c;

  /* type scale(rpx) */
  --t-hero: 66.56px;
  --t-title: 33.28px;
  --t-card: 17.68px;
  --t-body: 14.56px;
  --t-meta: 11.440000000000001px;
  --t-kicker: 10.4px;

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: var(--t-body);
  line-height: 1.6;
}

view, text, button, input {
  box-sizing: border-box;
}

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  line-height: inherit;
  color: inherit;
}

button::after {
  border: 0;
}

/* ===== 数字/数据统一等宽 ===== */
.mono {
  font-family: "SF Mono", "DIN Alternate", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ===== 通用排版 ===== */
.page-title {
  font-size: var(--t-title);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.12;
  color: var(--ink);
}

.page-subtitle {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* 区块标：设计 v3 竖向信号绿短条 + 白色标题 */
.section-kicker {
  display: flex;
  align-items: center;
  gap: 8.32px;
  margin: 24.96px 0 11.440000000000001px;
  font-size: 14.56px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.section-kicker::before {
  content: '';
  width: 3.12px;
  height: 14.56px;
  border-radius: 1.56px;
  background: var(--signal);
  box-shadow: 0 0 6.24px rgba(62, 230, 160, 0.6);
}

/* ===== 通用按钮 ===== */
.primary-button.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 54.08px;
  padding: 9.36px 14.56px;
  color: var(--signal-ink);
  background: var(--signal-gradient);
  box-shadow: var(--signal-glow);
  border-radius: 14.56px;
  font-size: 15.600000000000001px;
  font-weight: 700;
  letter-spacing: 0;
  margin: 0;
  line-height: 1.4;
  transition: opacity 0.15s ease;
}

.primary-button:active {
  opacity: 0.82;
}

.ghost-button.ghost-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 43.68px;
  padding: 7.28px 12.48px;
  color: var(--ink-dim);
  background: var(--surface);
  border: 0.52px solid var(--line-strong);
  width: 100%;
  margin: 0;
  line-height: 1.4;
  border-radius: 12.48px;
  font-size: var(--t-meta);
}

.ghost-button:active {
  opacity: 0.7;

/* ===== 空状态:虚线环徽标 ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 20.8px;
  text-align: center;
}

  border-radius: 50%;
  font-size: 27.04px;
  color: var(--signal);
  line-height: 1;
}

.empty-state .empty-title {
  margin-top: 15.600000000000001px;
  font-size: 17.68px;
  font-weight: 700;
}

.empty-state .empty-desc {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* ===== 备注提示 ===== */
.note-card {
  padding: 12.48px;
  color: var(--ink-dim);
  background: var(--surface-2);
  border: 0.52px solid var(--line-strong);
  border-radius: 8.32px;
  font-size: var(--t-kicker);
  line-height: 1.6;
