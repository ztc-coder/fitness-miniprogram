/* FORGE 3.0：近黑墨绿底、柔和图托卡片、翡翠渐变行动与发光层次，原生页面共享同一色板。 */
 .native-page {
  /* color */
  --bg: #08110e;
  --surface: #111d18;
  --surface-2: #1a2a23;
  --line: #1f3029;
  --line-strong: #2c4339;
  --ink: #eef7f2;
  --ink-dim: #a3b6ac;
  --ink-faint: #8aa095;
  --signal: #3ee6a0;
  --signal-deep: #1fbf83;
  --signal-ink: #062014;
  --signal-soft: rgba(62, 230, 160, 0.12);
  --signal-line: rgba(62, 230, 160, 0.45);
  --signal-glow: 0 0 16.64px rgba(62, 230, 160, 0.28);
  --signal-gradient: linear-gradient(180deg, #6ff5bd 0%, #3ee6a0 45%, #1fbf83 100%);
  --card-gradient: linear-gradient(180deg, #142420 0%, #0f1b17 100%);
  --card-shadow: 0 6.24px 20.8px rgba(0, 0, 0, 0.35);
  --thumb-gradient: linear-gradient(145deg, #e9fff5 0%, #b9f3d8 100%);
  --amber: #ffb020;
  --danger: #ff8f7c;

  /* type scale(rpx) */
  --t-hero: 66.56px;
  --t-title: 33.28px;
  --t-card: 17.68px;
  --t-body: 14.56px;
  --t-meta: 11.440000000000001px;
  --t-kicker: 10.4px;

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: var(--t-body);
  line-height: 1.6;
}

view, text, button, input {
  box-sizing: border-box;
}

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  line-height: inherit;
  color: inherit;
}

button::after {
  border: 0;
}

/* ===== 数字/数据统一等宽 ===== */
.mono {
  font-family: "SF Mono", "DIN Alternate", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ===== 通用排版 ===== */
.page-title {
  font-size: var(--t-title);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.12;
  color: var(--ink);
}

.page-subtitle {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* 区块标：设计 v3 竖向信号绿短条 + 白色标题 */
.section-kicker {
  display: flex;
  align-items: center;
  gap: 8.32px;
  margin: 24.96px 0 11.440000000000001px;
  font-size: 14.56px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.section-kicker::before {
  content: '';
  width: 3.12px;
  height: 14.56px;
  border-radius: 1.56px;
  background: var(--signal);
  box-shadow: 0 0 6.24px rgba(62, 230, 160, 0.6);
}

/* ===== 通用按钮 ===== */
.primary-button.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 54.08px;
  padding: 9.36px 14.56px;
  color: var(--signal-ink);
  background: var(--signal-gradient);
  box-shadow: var(--signal-glow);
  border-radius: 14.56px;
  font-size: 15.600000000000001px;
  font-weight: 700;
  letter-spacing: 0;
  margin: 0;
  line-height: 1.4;
  transition: opacity 0.15s ease;
}

.primary-button:active {
  opacity: 0.82;
}

.ghost-button.ghost-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 43.68px;
  padding: 7.28px 12.48px;
  color: var(--ink-dim);
  background: var(--surface);
  border: 0.52px solid var(--line-strong);
  width: 100%;
  margin: 0;
  line-height: 1.4;
  border-radius: 12.48px;
  font-size: var(--t-meta);
}

.ghost-button:active {
  opacity: 0.7;
}

/* ===== 空状态:虚线环徽标 ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 20.8px;
  text-align: center;
}

.empty-state .empty-glyph {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72.8px;
  height: 72.8px;
  border: 1.04px dashed var(--line-strong);
  border-radius: 50%;
  font-size: 27.04px;
  color: var(--signal);
  line-height: 1;
}

.empty-state .empty-title {
  margin-top: 15.600000000000001px;
  font-size: 17.68px;
  font-weight: 700;
}

.empty-state .empty-desc {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* ===== 备注提示 ===== */
.note-card {
  padding: 12.48px;
  color: var(--ink-dim);
  background: var(--surface-2);
  border: 0.52px solid var(--line-strong);
  border-radius: 8.32px;
  font-size: var(--t-kicker);
  line-height: 1.6;
}

.page {
  min-height: 100vh;
  padding: 15.600000000000001px 16.64px calc(24.96px + 34px);
  box-sizing: border-box;
  background: var(--bg);
}

.archive-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8.32px;
}

.archive-header .page-title { font-size: 24.96px; }
.sync-status { color: var(--signal); font-size: 11.96px; white-space: nowrap; }
.sync-status.pending { color: var(--amber); }

/* ===== 分段胶囊 ===== */
.record-tabs {
  display: flex;
  gap: 4.16px;
  margin: 12.48px 0 10.4px;
  padding: 4.16px;
  background: var(--surface);
  border: 0.52px solid var(--line-strong);
  border-radius: 11.440000000000001px;
}

.record-tab {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  width: auto !important;
  min-width: 0 !important;
  min-height: 45.760000000000005px;
  margin: 0 !important;
  flex: 1;
  padding: 8.32px 6.24px !important;
  line-height: 1.4 !important;
  background: transparent !important;
  color: var(--ink-faint) !important;
  font-size: var(--t-body) !important;
  border-radius: 10.4px !important;
  border: 0.52px solid transparent !important;
}

.record-tab.active {
  color: var(--signal) !important;
  background: var(--signal-soft) !important;
  border-color: var(--signal-line) !important;
  font-weight: 800;
}

/* ===== 独立场次卡片 ===== */
.record-list {
  display: flex;
  flex-direction: column;
  gap: 8.32px;
}

.record-item {
  display: flex;
  align-items: center;
  gap: 9.36px;
  min-height: 66.56px;
  padding: 9.36px;
  background: var(--card-gradient);
  border: 0.52px solid var(--line);
  border-radius: 14.56px;
  box-shadow: var(--card-shadow);
}

.record-date {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  width: 45.760000000000005px;
  min-height: 45.760000000000005px;
  align-items: center;
  justify-content: center;
  padding: 4.16px 3.12px;
  background: var(--surface-2);
  border: 0.52px solid var(--line-strong);
  border-radius: 10.4px;
}

.record-day {
  font-family: "SF Mono", Menlo, monospace;
  font-size: 21.84px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
}

.record-month {
  margin-top: 4.16px;
  font-size: var(--t-kicker);
  color: var(--ink-faint);
}

.record-main {
  flex: 1;
  min-width: 0;
}

.record-name {
  font-size: 14.56px;
  font-weight: 700;
}

.record-meta {
  margin-top: 2.08px;
  font-size: var(--t-kicker);
  color: var(--ink-faint);
}

.record-volume {
  font-family: "SF Mono", Menlo, monospace;
  font-size: var(--t-meta);
  font-weight: 700;
  color: var(--signal);
  max-width: 83.2px;
  overflow-wrap: break-word;
  text-align: right;
}

/* ===== 趋势图 ===== */
.metric-btn {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: auto !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 8.32px 11.440000000000001px !important;
  line-height: 1.4 !important;
  background: var(--signal-soft) !important;
  color: var(--signal) !important;
  border: 0.52px solid var(--signal-line) !important;
  border-radius: 519.48px !important;
  font-size: var(--t-kicker) !important;
}

.chart-wrap {
  padding: 10.4px 13.52px 13.52px;
  background: var(--card-gradient);
  border: 0.52px solid var(--line);
  border-radius: 12.48px;
  box-shadow: var(--card-shadow);
}

.chart-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4.16px 8.32px;
}

.chart-title {
  font-size: 16.64px;
  font-weight: 800;
}

.chart-sub {
  font-size: var(--t-kicker);
  color: var(--ink-faint);
}

.chart {
  position: relative;
  height: 114.4px;
  margin-top: 39.52px;
  margin-bottom: 22.880000000000003px;
  margin-left: 29.12px;
  border-left: 0.52px solid var(--line-strong);
  border-bottom: 0.52px solid var(--line-strong);
}

.chart-bars {
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 8.32px;
  padding: 0 9.36px;
}

.chart-bar {
  position: relative;
  flex: 1;
  max-width: 33.28px;
  background: var(--signal-gradient);
  opacity: 0.72;
  box-shadow: var(--signal-glow);
  border-radius: 4.16px 4.16px 0 0;
}

.chart-bar.last {
  background: var(--signal-gradient);
  opacity: 1;
  border-top: 1.04px solid var(--signal);
  box-shadow: var(--signal-glow);
}

.bar-value {
  position: absolute;
  top: -19.76px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "SF Mono", Menlo, monospace;
  font-size: 9.36px;
  color: var(--ink-faint);
  white-space: nowrap;
}

.bar-label {
  position: absolute;
  bottom: -22.880000000000003px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "SF Mono", Menlo, monospace;
  font-size: 9.36px;
  color: var(--ink-faint);
}

.record-footnote {
  margin-top: 16.64px;
  color: var(--ink-faint);
  font-size: var(--t-kicker);
  line-height: 1.6;
}

/* ===== 指标切换弹层 ===== */
.sheet-mask {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  background: rgba(0, 0, 0, 0.64);
}

.sheet-card {
  width: 100%;
  padding: 18.72px 16.64px calc(20.8px + 34px);
  box-sizing: border-box;
  background: var(--surface);
  border-top: 0.52px solid var(--signal-line);
  border-radius: 16.64px 16.64px 0 0;
  box-shadow: var(--card-shadow);
}

.sheet-title {
  font-size: 17.68px;
  font-weight: 800;
  margin-bottom: 12.48px;
}

.sheet-option {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  margin: 6.24px 0 0 !important;
  padding: 12.48px !important;
  line-height: 1.4 !important;
  background: var(--surface-2) !important;
  border: 0.52px solid var(--line-strong) !important;
  border-radius: 10.4px !important;
  text-align: left;
  font-size: var(--t-body) !important;
  color: var(--ink-dim) !important;
}

.sheet-option.active {
  background: var(--signal-soft) !important;
  border-color: var(--signal-line) !important;
  color: var(--signal) !important;
  font-weight: 700;
}

.record-tab::after,
.metric-btn::after,
.sheet-option::after {
  display: none !important;
}

/* 纯装饰方向提示，不增加文案或交互。 */
.record-item::after {
  content: '';
  flex-shrink: 0;
  width: 5.2px;
  height: 5.2px;
  border-top: 1.04px solid var(--signal);
  border-right: 1.04px solid var(--signal);
  transform: rotate(45deg);
}

.chart-bar.last .bar-value,
.chart-bar.last .bar-label {
  color: var(--ink);
  font-weight: 800;
}

.empty-state {
  margin-top: 12.48px;
  background: var(--card-gradient);
  border: 0.52px solid var(--line);
  border-radius: 16.64px;
  box-shadow: var(--card-shadow);
}

.empty-state .empty-glyph {
  background: var(--signal-soft);
  border-color: var(--signal-line);
  box-shadow: var(--signal-glow);
}

/* Board 02: compact stats, chart scale and recent timeline. */
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8.32px; margin-bottom: 10.4px; }
.stat-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 13.52px 4.16px 10.4px; background: var(--card-gradient); border: 0.52px solid var(--line-strong); border-radius: 12.48px; }
.stat-label { margin-top: 7.28px; color: var(--ink-dim); font-size: 12.48px; }

.stat-number text { font-size: 12.48px; font-weight: 500; }
.stat-icon { position: relative; width: 17.68px; height: 17.68px; color: var(--signal); }
.icon-calendar { border: 1.56px solid var(--signal); border-radius: 3.12px; height: 16.64px; margin-top: 1.04px; }
.icon-calendar::before { content: ''; position: absolute; left: 2.08px; right: 2.08px; top: -3.64px; height: 5.2px; border-left: 2.08px solid var(--signal); border-right: 2.08px solid var(--signal); }
.icon-calendar::after { content: ''; position: absolute; top: 3.64px; left: 0; right: 0; border-top: 1.04px solid var(--signal); }
.icon-weight { border-left: 4.68px solid var(--signal); border-right: 4.68px solid var(--signal); border-radius: 2.6px; height: 12.48px; margin: 2.6px 0; }

.icon-flame { width: 13.52px; height: 17.68px; background: var(--signal-gradient); border-radius: 75% 5% 65% 60%; transform: rotate(-30deg); }
.icon-flame::after { content: ''; position: absolute; bottom: 0; right: 2.6px; height: 8.84px; width: 5.2px; border-radius: 70% 5% 65% 60%; background: var(--surface); }
.chart-heading-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4.16px; }
.chart-heading-row picker { flex: 1; min-width: 0; margin: -8.32px 0; padding: 8.32px 0; }
.chart-title { min-height: 29.12px; display: flex; align-items: center; line-height: 1.3; }
.picker-arrow { color: var(--ink-faint); font-size: 10.4px; margin-left: 4.16px; }

.tick-label { position: absolute; right: 100%; padding-right: 7.28px; transform: translateY(-50%); color: var(--ink-faint); font-size: 10.4px; }
.pr-badge { position: absolute; top: -38.480000000000004px; left: 50%; transform: translateX(-50%); padding: 0 6.24px; border-radius: 6.24px; background: var(--signal-gradient); box-shadow: var(--signal-glow); color: var(--signal-ink); font-size: 10.4px; font-weight: 800; }
.recent-heading { display: flex; align-items: center; justify-content: space-between; margin-top: 6.24px; }
.recent-heading .section-kicker { margin: 0; }
.view-all { display: flex; align-items: center; justify-content: flex-end; min-height: 45.760000000000005px; min-width: 76.96000000000001px; margin: 0; color: var(--ink-faint); font-size: 11.440000000000001px; }

.chart-empty { padding: 24.96px 0 12.48px; }
