/* FORGE 3.0：近黑墨绿底、柔和图托卡片、翡翠渐变行动与发光层次，原生页面共享同一色板。 */
 .native-page {
  /* color */
  --bg: #08110e;
  --surface: #111d18;
  --surface-2: #1a2a23;
  --line: #1f3029;
  --line-strong: #2c4339;
  --ink: #eef7f2;
  --ink-dim: #a3b6ac;
  --ink-faint: #8aa095;
  --signal: #3ee6a0;
  --signal-deep: #1fbf83;
  --signal-ink: #062014;
  --signal-soft: rgba(62, 230, 160, 0.12);
  --signal-line: rgba(62, 230, 160, 0.45);
  --signal-glow: 0 0 16.64px rgba(62, 230, 160, 0.28);
  --signal-gradient: linear-gradient(180deg, #6ff5bd 0%, #3ee6a0 45%, #1fbf83 100%);
  --card-gradient: linear-gradient(180deg, #142420 0%, #0f1b17 100%);
  --card-shadow: 0 6.24px 20.8px rgba(0, 0, 0, 0.35);
  --thumb-gradient: linear-gradient(145deg, #e9fff5 0%, #b9f3d8 100%);
  --amber: #ffb020;
  --danger: #ff8f7c;

  /* type scale(rpx) */
  --t-hero: 66.56px;
  --t-title: 33.28px;
  --t-card: 17.68px;
  --t-body: 14.56px;
  --t-meta: 11.440000000000001px;
  --t-kicker: 10.4px;

  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: var(--t-body);
  line-height: 1.6;
}

view, text, button, input {
  box-sizing: border-box;
}

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  line-height: inherit;
  color: inherit;
}

button::after {
  border: 0;
}

/* ===== 数字/数据统一等宽 ===== */
.mono {
  font-family: "SF Mono", "DIN Alternate", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ===== 通用排版 ===== */
.page-title {
  font-size: var(--t-title);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.12;
  color: var(--ink);
}

.page-subtitle {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* 区块标：设计 v3 竖向信号绿短条 + 白色标题 */
.section-kicker {
  display: flex;
  align-items: center;
  gap: 8.32px;
  margin: 24.96px 0 11.440000000000001px;
  font-size: 14.56px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.section-kicker::before {
  content: '';
  width: 3.12px;
  height: 14.56px;
  border-radius: 1.56px;
  background: var(--signal);
  box-shadow: 0 0 6.24px rgba(62, 230, 160, 0.6);
}

/* ===== 通用按钮 ===== */
.primary-button.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 54.08px;
  padding: 9.36px 14.56px;
  color: var(--signal-ink);
  background: var(--signal-gradient);
  box-shadow: var(--signal-glow);
  border-radius: 14.56px;
  font-size: 15.600000000000001px;
  font-weight: 700;
  letter-spacing: 0;
  margin: 0;
  line-height: 1.4;
  transition: opacity 0.15s ease;
}

.primary-button:active {
  opacity: 0.82;
}

.ghost-button.ghost-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 43.68px;
  padding: 7.28px 12.48px;
  color: var(--ink-dim);
  background: var(--surface);
  border: 0.52px solid var(--line-strong);
  width: 100%;
  margin: 0;
  line-height: 1.4;
  border-radius: 12.48px;
  font-size: var(--t-meta);
}

.ghost-button:active {
  opacity: 0.7;
}

/* ===== 空状态:虚线环徽标 ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 20.8px;
  text-align: center;
}

.empty-state .empty-glyph {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72.8px;
  height: 72.8px;
  border: 1.04px dashed var(--line-strong);

  color: var(--signal);
  line-height: 1;
}

.empty-state .empty-title {
  margin-top: 15.600000000000001px;
  font-size: 17.68px;
  font-weight: 700;
}

.empty-state .empty-desc {
  margin-top: 5.2px;
  font-size: var(--t-meta);
  color: var(--ink-dim);
}

/* ===== 备注提示 ===== */
.note-card {
  padding: 12.48px;
  color: var(--ink-dim);
  background: var(--surface-2);
  border: 0.52px solid var(--line-strong);

  line-height: 1.6;
}

.page {

.profile {
  display: flex;

  gap: 8.32px;
  padding: 12.48px;

}

.avatar {

.login-pill {
  display: inline-flex !important;
  justify-content: center;
  flex-shrink: 0;

  min-width: 0 !important;
  margin: 0 !important;
  line-height: 1.4 !important;
  background: transparent !important;
  align-items: center;
  gap: 5.2px;
  min-height: 45.760000000000005px;
  padding: 7.28px 0 !important;
  border: 0 !important;
  border-radius: 8.32px !important;

  font-size: var(--t-kicker) !important;
}

.login-dot {
  width: 8.32px;
  height: 8.32px;
  box-shadow: var(--signal-glow);
  border-radius: 50%;
  background: var(--signal);

/* ===== Inset Grouped 设置卡片 ===== */
.setting-list {
  display: flex;
  flex-direction: column;
  padding: 0 12.48px;

.setting-row {

}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-row > .setting-name {
  flex: 1;
  min-width: 0;
}

.setting-chevron {
  flex-shrink: 0;

}

.setting-main {

.section-kicker {

.profile-sub {

.month-card {
